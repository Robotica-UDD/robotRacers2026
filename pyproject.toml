[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robotracers-simulation"
version = "0.1.0"
description = "Simulación local RobotRacers con visión cenital y control por encoders"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "numpy>=2,<3",
  "opencv-contrib-python-headless>=4.10,<5",
]

[project.optional-dependencies]
hardware = ["pyserial>=3.5,<4"]
assets = ["Pillow>=11,<13"]

[project.scripts]
robotracers-sim = "simulation.service.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["simulation.service*", "simulation.adapters*", "simulation.tools*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["simulation/tests"]
pythonpath = ["."]
